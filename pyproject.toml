[project]
name = "home-budgeter"
description = "An app for proactive budgeting and transaction tracking."
authors = [
    { name = "Caroline Jeffra" , email = "caroline.jeffra@gmail.com" }
]
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-env>=1.7.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.3",
]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["app", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "session"
env = ["D:DATABASE_URL=postgresql+psycopg://budget:budget@localhost:5432/budget_test"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

